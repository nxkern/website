name: CI/CD

on: [push]

jobs:
  build:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v6
      - name: Install Buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah
      - name: Log in to Docker
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | buildah login docker.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      - name: Build Image
        id: build-image
        run: |
          buildah build \
          --storage-driver=vfs \
          --isolation=chroot \
          -t docker.io/nxusdev21/website-nxus:latest \
          -f ./Dockerfile .
      - name: Push to Docker.io
          buildah push \
            --storage-driver=vfs \
            docker.io/nxusdev21/website-nxus:latest
            
